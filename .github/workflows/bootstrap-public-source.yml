name: Bootstrap Sanitized Public Source

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-public-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-sanitized-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify sanitized source
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/EXPECTED_PART_SHA256 <<'EOF'
          5c3706d50cf36b11fb909f0e0db9294225c7f1d0003cef9159ac66e21f624cef  .bootstrap/source.part00
          2349fd364c8afc6532c2ef79a7b9113109e025debac87980a2507db07b126405  .bootstrap/source.part01
          66fc0a1f7ee59fdc78207d12d9395643fefc30ac97a5e9d9b13abdcd2be12ebd  .bootstrap/source.part02
          1555bb0bdbaf2bfe73767c0f60368dd6c423c9ee941dc3c3e694a88f837568d9  .bootstrap/source.part03.00
          f284435cd3c71cd03e7ea981da53a09183d4e3d459ad675d7a1aec2b3fe85ba0  .bootstrap/source.part03.01
          dc9a7f4894debab99fb0286ab67e8cf5ff00fcaa3878a80cb9e9e91aff164057  .bootstrap/source.part03.02
          8a1d683469d8e312c957de924b3406ce67c4b5235f3c1e870d75a4bbf8bc7a70  .bootstrap/source.part03.03
          6528b1062211e7387d552f57dea18b79afd2452e2d344d4f761f78f94a5ed133  .bootstrap/source.part03.04
          3bb46ea2f35e45e24a27c4c1309fc76953e2157f947f101756d166c2b5a5eb79  .bootstrap/source.part03.05.00
          59f3aa9d7cabf88ff05b4bb2e6e2bfe1bca2cb46479eeb454ebe824a254bfa9b  .bootstrap/source.part03.05.01
          be46646d08bef55e72bc4936efb816f84117ecffe7d60a43f1248bec5f309ed5  .bootstrap/source.part03.05.02.00
          1ce573ab2b05a1bf5d4776eaf070722d92309a6cb160cfb3961fff6720e12da7  .bootstrap/source.part03.05.02.01
          74b690b59e7e4fb71b82f01777ad54fa6538dc3d53e7d02accc2d06945619863  .bootstrap/source.part03.05.02.02
          83c9c0f8bd5f1eba5ed1ce897d8b4334e2b3c408557fd5ee8ba19e7942703ab9  .bootstrap/source.part03.05.02.03
          b6db7b985175b08fdd4de002d8e01fe6628dbce62bfe3ec673a6608332038f37  .bootstrap/source.part03.05.02.04
          f03d70eb6c4f0f96466e8ac5fe4e6986921a63a2c15242af7e3157825a79f83b  .bootstrap/source.part03.06
          011ac086b4eb7cf6f7ebcb1490a559bbf397decf8e9d10309f97df6ed312054a  .bootstrap/source.part03.07
          248d640b48a8fb33c67311a44678e2d6c0e2df173485df2d9857a8e369d9e64b  .bootstrap/source.part04
          6f1a1302023b8030f236944ddb61665697a3e87c8b738bd3eb17bb82bbffb681  .bootstrap/source.part05
          9ff426810fa857c2ffb61d69d2d032cf5ec35aebb6aeccc3c8fbd7f8adf1f08d  .bootstrap/source.part06
          90c471d87b87f5c6e64bea6befddb2b8eaf921af1d6b687f101342411648c745  .bootstrap/source.part07
          084af9d8c187862c4c44372020ee7c03a2fce0eaec1b1f1b44206f0b5569b16a  .bootstrap/source.part08
          ad45d40317b28a548f6060fdc9fb1e4b65e78d5e2ccd4b9d9fdee8f40aa7b716  .bootstrap/source.part09
          17caea709b2a1f7f2ada800abbac9d9eebbc9abc4c1ef60438f341a0f929e1ee  .bootstrap/source.part10
          0ddc7a6e80ad3e4455b299d64c17ff11cedc61d1d4bdec8d2ef8401db071da67  .bootstrap/source.part11
          EOF
          sha256sum -c /tmp/EXPECTED_PART_SHA256
          cat \
            .bootstrap/source.part00 \
            .bootstrap/source.part01 \
            .bootstrap/source.part02 \
            .bootstrap/source.part03.00 \
            .bootstrap/source.part03.01 \
            .bootstrap/source.part03.02 \
            .bootstrap/source.part03.03 \
            .bootstrap/source.part03.04 \
            .bootstrap/source.part03.05.00 \
            .bootstrap/source.part03.05.01 \
            .bootstrap/source.part03.05.02.00 \
            .bootstrap/source.part03.05.02.01 \
            .bootstrap/source.part03.05.02.02 \
            .bootstrap/source.part03.05.02.03 \
            .bootstrap/source.part03.05.02.04 \
            .bootstrap/source.part03.06 \
            .bootstrap/source.part03.07 \
            .bootstrap/source.part04 \
            .bootstrap/source.part05 \
            .bootstrap/source.part06 \
            .bootstrap/source.part07 \
            .bootstrap/source.part08 \
            .bootstrap/source.part09 \
            .bootstrap/source.part10 \
            .bootstrap/source.part11 \
            | base64 -d > /tmp/locowiki-public-source.tar.gz
          echo '612194eaa695768532f3752d47aa609e116ab507745cb6518b089f3ce4736b39  /tmp/locowiki-public-source.tar.gz' | sha256sum -c -
          mkdir -p /tmp/locowiki-public-source
          tar -xzf /tmp/locowiki-public-source.tar.gz -C /tmp/locowiki-public-source
          SOURCE='/tmp/locowiki-public-source/locowiki-android-public-ci'
          test -f "$SOURCE/scripts/verify_public_tree.py"
          rsync -a --exclude '.git/' --exclude 'README.md' "$SOURCE/" ./
          python scripts/verify_public_tree.py
          python scripts/verify_privacy.py

      - name: Commit sanitized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: import sanitized LocoWiki Android source'
          git push origin HEAD:main
